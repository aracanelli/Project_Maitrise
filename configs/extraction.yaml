# Detection and mining rules (report, chapter 4 and Appendix II)
analysis_unit: method
labels:
  - ADD_LOG
  - REMOVE_LOG
  - CHANGE_LEVEL

include_test_code: false
skip_merges: true
bulk_commit_java_files: 100      # commits touching more Java files than this are flagged is_bulk
root_commit_is_bulk: true
levenshtein_threshold: 0.5       # value of the Zeng et al. replication package
srcml_timeout_seconds: 60

# project-specific callers whose calls are player-facing game messages, not diagnostic logs
game_message_callers:
  - GLog

# project logging wrappers without a 'log' token in the caller name (normalised as formal)
project_logger_callers:
  - UCore      # Mindustry's logging utility before arc.util.Log (UCore.log / UCore.error)

# units whose logger calls reply to operator console commands (UI output, not logging).
# Matched on the innermost class name and the method name.
console_reply_contexts:
  - class: ServerControl          # Mindustry dedicated server console
    methods: [registerCommands, readCommands]

# statement continuity: a matched pair also needs this payload similarity (arguments,
# without a Level.X argument); calibrated on a separate development sample of 40 CHANGE_LEVEL events
payload_continuity_threshold: 0.7

level_scale: [TRACE, DEBUG, INFO, WARN, ERROR]

logging_frameworks:
  - log4j
  - slf4j
  - apache_commons_logging
  - java_util_logging
  - jdk_system_logger
  - arc_log
  - libgdx_app
  - riiablo_logger

generated_path_segments: [generated, generated-sources, gen-src]
generated_header_markers: ["@Generated", "generated by", "do not edit", "auto-generated"]
